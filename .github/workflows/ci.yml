# Verificación en cada push / PR. El despliegue lo hace Cloudflare Pages
# automáticamente desde su integración con GitHub (ver README).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Tipos (Astro y TypeScript)
        run: npm run check
      - run: npm run build
